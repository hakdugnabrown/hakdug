<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Style Mockup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f0f12;
      font-family: Arial, sans-serif;
      color: white;
    }

    .phone {
      position: relative;
      width: 390px;
      height: 820px;
      background: linear-gradient(180deg, #17181d, #090a0d);
      border-radius: 34px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .video {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,168,0,0.3), transparent 20%),
        linear-gradient(135deg, rgba(31,32,40,0.9), rgba(8,9,12,0.8)),
        url("https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80") center/cover no-repeat;
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff305d;
      box-shadow: 0 0 10px rgba(255,48,93,0.9);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      opacity: 0.95;
    }

    .status .signal {
      width: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 2px;
    }

    .status .signal span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: white;
    }

    .status .signal span:nth-child(1) { height: 5px; }
    .status .signal span:nth-child(2) { height: 9px; }
    .status .signal span:nth-child(3) { height: 13px; }
    .status .signal span:nth-child(4) { height: 17px; }

    .side-actions {
      position: absolute;
      right: 16px;
      bottom: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 3;
    }

    .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    .icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 22px;
      font-weight: bold;
    }

    .icon.red {
      background: rgba(255, 48, 93, 0.88);
    }

    .caption {
      position: absolute;
      left: 16px;
      bottom: 18px;
      right: 90px;
      z-index: 3;
    }

    .user {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .text {
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.95;
      margin-bottom: 10px;
      max-width: 250px;
    }

    .music {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      opacity: 0.9;
    }

    .disc {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e9e7e7, #707070);
      position: relative;
      animation: spin 4s linear infinite;
    }

    .disc::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #171717;
      border: 1px solid rgba(255,255,255,0.3);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .profile-bubble {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff5f7d, #fbc7d4);
      border: 3px solid rgba(255,255,255,0.65);
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      z-index: 4;
    }

    .profile-bubble::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff0f5, #ffd0da);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="video"></div>

    <div class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>For You</span>
      </div>
      <div class="status">
        <div class="signal">
          <span></span><span></span><span></span><span></span>
        </div>
        <span>9:41</span>
      </div>
    </div>

    <div class="side-actions">
      <div class="action">
        <div class="icon red">♥</div>
        <div>12.4K</div>
      </div>

      <div class="action">
        <div class="icon">💬</div>
        <div>924</div>
      </div>

      <div class="action">
        <div class="icon">↗</div>
        <div>Share</div>
      </div>
    </div>

    <div class="caption">
      <div class="user">@ur_pk22</div>
      <div class="text">The vibe is unreal tonight ✨ #fyp #viral #reels</div>
      <div class="music">
        <div class="disc"></div>
        <span>Original audio - @ur_pk22</span>
      </div>
    </div>

    <div class="profile-bubble"></div>
  </div>
</body>
</html>
